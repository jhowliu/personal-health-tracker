services:
  api:
    build: ./backend
    container_name: pht-api
    restart: unless-stopped
    env_file: .env
    environment:
      # Docker services reach MinIO on its container port, not the host mapping.
      S3_ENDPOINT: http://minio:9000
    volumes:
      - api_data:/data
    ports:
      - "8000:8000"
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/healthz').status == 200 else sys.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3

  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    container_name: pht-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "9090:9000"
      - "9091:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  api_data:
  minio_data:
