[project]
name = "pht-api"
version = "0.1.0"
description = "每日減脂計畫 API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "aiosqlite>=0.20",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
    "cryptography>=43.0",
    "apscheduler>=3.10",
    "boto3>=1.35",
    "yoyo-migrations>=8.2",
    "python-multipart>=0.0.12",
    "uuid7>=0.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "import-linter>=2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# conftest 會 import scripts.migrate。`python -m pytest` 會自動把當前目錄放進
# sys.path,但 `pytest` 這個 console script 不會 —— 明寫出來,兩種都能跑。
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
# N818 要求例外類別以 Error 結尾。domain 的例外讀起來是 `raise NotFound("找不到這個課表")`,
# 加上後綴反而囉嗦,而且基底類別 DomainError 已經帶了後綴。
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
# Seed rows are tabular data. One catalog entry per line reads far better than wrapped tuples.
"seeds/foods.py" = ["E501"]
"seeds/exercises.py" = ["E501"]

# The dependency rule: source dependencies only point inward. Run with `lint-imports`.
[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Dependencies point inward: api > adapters > application > domain"
type = "layers"
layers = ["app.api", "app.adapters", "app.application", "app.domain"]

[[tool.importlinter.contracts]]
name = "Adapters do not depend on each other"
type = "independence"
modules = [
    "app.adapters.ai",
    "app.adapters.auth",
    "app.adapters.push",
    "app.adapters.sqlite",
    "app.adapters.storage",
]

[[tool.importlinter.contracts]]
name = "Domain and application stay free of frameworks and I/O libraries"
type = "forbidden"
source_modules = ["app.domain", "app.application"]
forbidden_modules = [
    "fastapi",
    "starlette",
    "pydantic",
    "aiosqlite",
    "sqlite3",
    "boto3",
    "httpx",
    "jwt",
    "argon2",
    "apscheduler",
]

[[tool.importlinter.contracts]]
name = "SQLite stores reach each other only through ports, never by import"
type = "independence"
modules = [
    "app.adapters.sqlite.accounts",
    "app.adapters.sqlite.body",
    "app.adapters.sqlite.days",
    "app.adapters.sqlite.foods",
    "app.adapters.sqlite.meal_photos",
    "app.adapters.sqlite.meals",
    "app.adapters.sqlite.reminders",
    "app.adapters.sqlite.training",
    "app.adapters.sqlite.workout_execution",
]
